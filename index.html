<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Forecast Channel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Forecast">
  <meta name="description" content="The Wii Forecast Channel, ported to the web. Bring your own WAD.">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <canvas id="screen" aria-label="Forecast Channel"></canvas>
  <button id="fullscreen" class="fs-pill" type="button" aria-label="Full screen" title="Full screen (F)">
    <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
    <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
    <span class="fs-label">Full screen</span>
  </button>

  <!-- First run: the visitor supplies their own channel + key. Nothing leaves the browser. -->
  <section id="setup" hidden>
    <div class="card">
      <h1>Forecast Channel</h1>
      <p class="lead">To start, choose your own copy of the channel. The files stay in this browser and are never uploaded.</p>
      <label class="file">
        <span class="label">Forecast Channel WAD</span>
        <span class="hint">USA, HAFE v7 (.wad)</span>
        <input id="wad-input" type="file" accept=".wad,application/octet-stream">
        <span class="chosen" id="wad-name">No file chosen</span>
      </label>
      <label class="file">
        <span class="label">Wii common key</span>
        <span class="hint">16-byte file (common-key.bin)</span>
        <input id="key-input" type="file" accept=".bin,application/octet-stream">
        <span class="chosen" id="key-name">No file chosen</span>
      </label>
      <p class="error" id="setup-error" role="alert"></p>
      <button id="setup-start" type="button" disabled>Start</button>
    </div>
  </section>

  <div id="overlay" hidden><pre id="overlay-text"></pre></div>
  <button id="replace-files" type="button" hidden>Replace channel files</button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
